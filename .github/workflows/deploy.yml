name: Deploy

on:
  push:
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: read
  pull-requests: read
  statuses: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ">=26.2"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: v1-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.md', '**/*.css') }}
          restore-keys: |
            v1-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::738555527767:role/GitHubActionsOIDC
          role-session-name: ${{ github.run_id }}
          aws-region: us-east-1

      - name: Deploy
        run: pnpm run deploy
        env:
          ATPROTO_IDENTIFIER: ${{ secrets.ATPROTO_IDENTIFIER }}
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
