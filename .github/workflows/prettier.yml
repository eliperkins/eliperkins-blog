name: Format
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ">=26.2"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: v1-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.md', '**/*.css') }}
          restore-keys: |
            v1-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Format with Prettier
        run: pnpm format

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Formatted files with Prettier"
